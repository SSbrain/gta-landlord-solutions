<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you — GTA Landlord Solutions</title>
<meta name="description" content="Thank you for writing to GTA Landlord Solutions. We’ll get back to you quickly.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--brand:#F5A623;--cream:#FFF4E0;--ink:#1F3A5F;--ink2:#3A5478;--muted:#5A718C;--line:#F0D9A8;--dark:#1F3A5F}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--cream);line-height:1.55;min-height:100vh;display:flex;flex-direction:column}
h1{font-family:Montserrat,Inter,Arial,sans-serif;font-size:36px;font-weight:800;line-height:1.2;margin:0 0 12px}
a{color:var(--ink2)}
header{background:#fff;border-bottom:4px solid var(--brand)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;max-width:1100px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand b{font-family:Montserrat,Arial,sans-serif;font-size:18px;color:var(--ink);display:block;line-height:1.1}
.brand small{font-size:9px;letter-spacing:.45em;color:var(--ink2);font-weight:600}
main{flex:1;display:grid;place-items:center;padding:48px 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:40px 32px;max-width:560px;text-align:center;box-shadow:0 14px 40px rgba(26,20,8,.08)}
.card p{margin:0 0 22px;color:var(--muted);font-size:17px}
.btn{display:inline-block;background:var(--brand);color:var(--ink);text-decoration:none;font-weight:700;padding:14px 22px;border-radius:6px;border:2px solid var(--brand);margin:0 8px 8px 0}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.coords{margin-top:8px;font-size:15px}
.coords a{color:var(--ink);font-weight:600;text-decoration:none}
footer{background:#16304F;color:#E8EEF5;text-align:center;padding:22px 20px;font-size:14px}
footer small{display:block;opacity:.75;margin-top:6px;font-size:12px}
@media(max-width:560px){h1{font-size:28px}.card{padding:28px 18px}.btn{display:block}}
</style>
</head>
<body>
<header><div class="bar">
 <a class="brand" href="index.html" aria-label="GTA Landlord Solutions">
  <svg width="40" viewBox="0 0 48 48" aria-hidden="true">
    <circle cx="36" cy="11" r="7" fill="#F5A623"/>
    <path d="M5 22 24 7l19 15" fill="none" stroke="#1F3A5F" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M9 20.5v22.5h30V20.5" fill="none" stroke="#1F3A5F" stroke-width="3.5"/>
    <rect x="19" y="28" width="10" height="15" rx="1.5" fill="#1F3A5F"/>
  </svg>
  <span><b>GTA Landlord</b><small>SOLUTIONS</small></span></a>
</div></header>
<main>
 <div class="card">
  <h1>Thank you.</h1>
  <p>We’ve received your note and will get back to you quickly.</p>
  <a class="btn" href="index.html">Back to the homepage</a>
 </div>
</main>
<footer>
 <span>GTA Landlord Solutions · Greater Toronto Area</span>
 <small>Real One Realty Inc., Brokerage</small>
</footer>
</body>
</html>
